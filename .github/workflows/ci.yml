name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: validate shell scripts
        run: |
          shellcheck bootstrap.sh rebuild.sh check-skhd.sh
          bash -n bootstrap.sh rebuild.sh check-skhd.sh

  flake:
    name: configuration + full build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25

      - name: nix flake check
        run: >
          nix flake check --no-build --no-write-lock-file
          --override-input wallpaper path:./.github/wallpaper-stub

      - name: build the darwin system
        run: >
          nix build .#darwinConfigurations.mac.system --no-link --no-write-lock-file
          --override-input wallpaper path:./.github/wallpaper-stub

      - name: validate configuration files
        run: |
          nix develop .#ci --no-write-lock-file \
            --override-input wallpaper path:./.github/wallpaper-stub \
            --command bash -euo pipefail -c '
              actionlint
              git ls-files -z "*.json" | xargs -0 jq empty
              jq empty home/.simplebarrc
              taplo lint home/.config/aerospace/aerospace.toml home/.config/herdr/config.toml
            '

      - name: start Neovim with the locked plugins
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/nvim-data
          XDG_STATE_HOME: ${{ runner.temp }}/nvim-state
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          if ! nix develop .#ci --no-write-lock-file \
              --override-input wallpaper path:./.github/wallpaper-stub \
              --command nvim --headless -i NONE "+Lazy! restore" +qa \
              >"$RUNNER_TEMP/nvim-install.log" 2>&1; then
            cat "$RUNNER_TEMP/nvim-install.log"
            exit 1
          fi
          nix develop .#ci --no-write-lock-file \
            --override-input wallpaper path:./.github/wallpaper-stub \
            --command nvim --headless -i NONE +qa

      - name: verify repository invariants
        run: |
          git check-ignore --no-index .no-mistakes/example
          test "$(git ls-files 'home/.config/herdr/*')" = "home/.config/herdr/config.toml"
          git check-ignore --no-index \
            home/.config/herdr/example.log \
            home/.config/herdr/example.sock \
            home/.config/herdr/session.json \
            home/.config/herdr/.plugins.lock \
            home/.config/herdr/release-notes.json
          git diff --exit-code
